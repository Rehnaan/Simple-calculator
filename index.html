<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Animated Calculator</title>
    <!-- Modern font from Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Decorative background circles -->
    <div class="circle circle-1"></div>
    <div class="circle circle-2"></div>

    <div class="calculator">
        <div class="display">
            <div data-previous-operand class="previous-operand"></div>
            <div data-current-operand class="current-operand">0</div>
        </div>
        <div class="keypad">
            <button data-all-clear class="span-two btn-action">AC</button>
            <button data-delete class="btn-action">DEL</button>
            <button data-operation class="btn-operation">÷</button>

            <button data-number>7</button>
            <button data-number>8</button>
            <button data-number>9</button>
            <button data-operation class="btn-operation">×</button>

            <button data-number>4</button>
            <button data-number>5</button>
            <button data-number>6</button>
            <button data-operation class="btn-operation">-</button>

            <button data-number>1</button>
            <button data-number>2</button>
            <button data-number>3</button>
            <button data-operation class="btn-operation">+</button>

            <button data-number>0</button>
            <button data-number>.</button>
            <button data-equals class="span-two btn-equals">=</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
